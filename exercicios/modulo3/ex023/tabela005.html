<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercicio Tabela</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            border-collapse: collapse;
            width: 500px;
        }

        caption {
            font-size: 1.3em;
            font-weight: bolder;
            padding: 8px;
        }

        td,th {
            border: 1px solid black;
            padding: 8px;
        }

        col.cnome {
            background-color: blueviolet;
        }

        col.cgrupo {
            background-color: brown;
        }
    </style>
</head>
<body>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="cgrupo" span="3">
            
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profissão</th>
        </tr>
        <tr>
            <td>Claudio</td>
            <td>M</td>
            <td>25</td>
            <td>Programador</td>
        </tr>
        <tr>
            <td>Gustavo</td>
            <td>M</td>
            <td>40</td>
            <td>Médico</td>
        </tr>
        <tr>
            <td>Hélio</td>
            <td>M</td>
            <td>36</td>
            <td>Ator</td>
        </tr>
        <tr>
            <td>Maria</td>
            <td>F</td>
            <td>80</td>
            <td>Professor</td>
        </tr>
        <tr>
            <td>Geovana</td>
            <td>F</td>
            <td>33</td>
            <td>Quimica</td>
        </tr>
        <tr>
            <td>Felipe</td>
            <td>M</td>
            <td>36</td>
            <td>Programador</td>
        </tr>
    </table>
</body>
</html>
