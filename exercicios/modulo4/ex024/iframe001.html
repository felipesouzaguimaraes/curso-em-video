<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de Iframes</title>
</head>
<body>
    <h1>Testando o uso de Iframes</h1>
    <p>Acessando o site do <a href="https://www.cursoemvideo.com" target="_blank">curso em video</a> para aprender a programar</p>

    <p>
        Acessando o site do <!--Por padrão 300x150-->
        <iframe src="https://www.cursoemvideo.com" frameborder="0" height="500" width="200"> 
            <a href="https://www.cursoemvideo.com" target="_blank">Curso em video</a>
        </iframe>
        para aprender a programar.
    </p>

    <p>Tambem o site do <iframe src="https://www.google.com.br" frameborder="0"> 
        <a href="https://www.google.com.br" target="_blank">Google</a>
    </iframe> é muito legal, pena que não funciona dentro do Iframe</p>

    <p>O repositorio do <iframe src="https://gustavoguanabara.github.io" frameborder="0" height="400" width="300"> 
        <a href="https://gustavoguanabara.github.io" target="_blank">Guanabara</a> 
    </iframe> tambem é bem legal</p>
</body>
</html>
