<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudos de Iframes</title>
</head>
<body>
    <h1>Testando o uso de Iframes</h1>
    <p>Acessando o site do <a href="https://www.cursoemvideo.com" target="_blank">curso em video</a> para aprender a programar</p>

    <p>
        Acessando o site do 
        <iframe src="https://www.cursoemvideo.com" frameborder="0"></iframe>
        para aprender a programar.
    </p>

    <p>Tambem o site do <iframe src="https://www.google.com.br" frameborder="0"></iframe> é muito legal</p>
</body>
</html>
