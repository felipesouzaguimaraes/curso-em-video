<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color-Range-File</title>
</head>
<body>
    <h1>Tipos de formularios</h1>
    <form action="" method="post" autocomplete="on">
        <p>
            <label for="icor">Cor</label>
            <input type="color" name="cor" id="icor" value="#33bb55">
        </p>
        <p>
            <label for="isatisfa">Nível de Satisfação</label>
            <input type="range" name="satisfa" id="isatisfa" min="0" max="10" value="5">
        </p>
        <p>
            <label for="iperfil">Foto do perfil</label>
            <input type="file" name="perfil" id="iperfil">
        </p>
        <p>
        <input type="submit" value="Enviar">
        <input type="submit" value="Limpar">
    </p>
    </form>
</body>
</html>
