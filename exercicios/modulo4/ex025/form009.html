<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Usando output no formulario</h1>
    <form action="" method="get" autocomplete="on">
        <p>
            <label for="inum">Nota</label>
            <input type="range" name="num" id="inum" min="0" max="10" value="5" oninput="inota.innerHTML=Number(inum.value)">
                
            <label for="inota"></label>
            <output id="inota">5</output>
        </p>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
